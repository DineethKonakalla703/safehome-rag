version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: safehome-mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: safehome_rag
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: safehome-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safehome-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/safehome_rag
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost,http://localhost:5173
      - NODE_ENV=production
    depends_on:
      - mongodb
      - redis
    volumes:
      - upload_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safehome-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
  upload_data:
